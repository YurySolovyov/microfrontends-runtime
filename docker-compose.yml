services:
  static:
    image: nginx:1.28.0-alpine3.21
    ports:
      - 9000:9000
      - 9001:9001
      - 9002:9002
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static:/static
      - apps:/apps
      - ./public:/public

  runtime:
    environment:
      NODE_ENV: 'development'
    build:
      dockerfile: ../Dockerfile
      context: ./shell
    command: yarn start
    volumes:
      - ./runtime:/app
      - static:/static

  shell:
    environment:
      NODE_ENV: 'development'
    command: yarn start
    build:
      dockerfile: ../Dockerfile
      context: ./shell

    depends_on:
      - runtime
    volumes:
      - ./shell:/app
      - static:/static

  blog:
    environment:
      NODE_ENV: 'development'
      APP_NAME: 'blog'
    command: yarn start
    build:
      dockerfile: ../Dockerfile
      context: ./blog
    volumes:
      - ./blog:/app
      - static:/static
      - apps:/apps

  shop:
    environment:
      NODE_ENV: 'development'
      APP_NAME: 'shop'
    command: yarn start
    build:
      dockerfile: ../Dockerfile
      context: ./shop
    volumes:
      - ./shop:/app
      - static:/static
      - apps:/apps

volumes:
  static:
  apps:
